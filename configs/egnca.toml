# The E(n)-GNCA port: Gala's rule as their own code runs it, on this project's
# regeneration task.
#
#   .venv/Scripts/python.exe scripts/train_egnca.py configs/egnca.toml --section port
#   .venv/Scripts/python.exe scripts/train_egnca.py configs/egnca.toml --list-sections
#
# A SEPARATE FILE FROM configs/regeneration.toml, and not because it is tidier.
# Every arm in that file is an `AANCARule` with frames, births, identity,
# sterics and closures, and its [base.inputs] states a weight for each. This
# rule has none of them: it places CA positions and produces no residue
# orientation (see `aanca.egnca`). Three settings carry its whole objective, and
# a section of this file is not comparable column-for-column with a section of
# that one -- the readouts are different quantities.
#
# Nothing that changes a result is a command-line option: see `aanca.config`.
# [base.inputs] states every setting explicitly so a later change to a parser
# default cannot reinterpret a run recorded here.
#
# WHAT THE PORT CHANGES AT ONCE, AND WHY THAT IS ALLOWED HERE. Six things
# differ from g28 together: the rule, the rollout length, full BPTT, the
# removal of the step cap, the native edge set, and the full pair set.
# One-variable arms are correct when ablating *from* something that works, and
# this project has never had that -- so this is a replication target, and the
# ablations come after it moves
# (docs/claims/the-task-is-to-realise-coordinates-for-a-given-contact-graph.md).
#
# WHAT WAS WRONG AND IS NOW FIXED -- 24 Nov. At the PUBLISHED lr of 1e-3 half
# the held-out set used to go non-finite by update 750 on a laptop run, and
# about 10 % of TRAINING rollouts overflowed to a non-finite loss and were
# skipped at lr 1e-3, 3e-4 and 1e-4 alike -- so the far crops contributed no
# gradient at any learning rate. Read `n` and `diverged` before any other
# column; a row with a `start` below 8.77 is a mean over survivors.
#
# AND THE KNOBS WERE NEVER WHERE THE FIX WAS. `lr`, `clip` and `weight_decay`
# below are ALREADY the published values for this task
# (`trainers/geometric_graph.py` in `gengala/egnca`: -lr 1e-3, -wd 1e-5,
# -gcv 1.0). A 1,000-update sweep over all three left one to four crops gone at
# every setting tried, and an `lr = 3e-4` override was briefly added here and
# then dropped as a departure invented to compensate for something missing.
# What was missing was FIVE settings the paper never prints and the authors'
# code for this task carries on by default -- a tanh on `phi_x`'s output
# (`has_coord_act=True`), that layer zero-initialised and unbiased, a residual
# `h` update, a tanh hidden activation, and PairNorm on the node features. All
# five are now `[base.inputs]` keys at the authors' defaults, at the top of this
# section. See
# docs/claims/the-divergence-is-a-missing-published-tanh-not-a-property-of-the-rule.md
#
# The trainer now counts skipped updates BY REASON and prints the rate per
# evaluation interval, because that rate -- not the loss -- is what says whether
# the bound works: an overflowing crop is excused rather than charged.
#
# MEASURED, 1,000 laptop updates at this section with the five on: `n` 15 and
# `diverged` 0 at every evaluation, `start` flat at 8.774, and ZERO non-finite
# training rollouts -- against 145 of 1,000 and five held-out crops lost with
# the four switchable ones off. The `total` column does NOT fall over that
# window (7.35 -> 11.68); the divergence is fixed and whether the rule learns
# the task is still open. The full table is in scripts/train_egnca.py's
# docstring.
#
# THE MECHANISM THE TANH REMOVES, kept so a future knob is not tried blind and
# so the symptom is recognisable if it returns. All of it is measured WITHOUT
# `has_coord_act`, i.e. on the port as it stood before 24 Nov; with the bound,
# `phi_x` is in (-1, 1), |1 + phi_x| is in (0, 2) and the runaway branch below
# does not exist. Nothing about the weights
# or the gradients goes non-finite: the coordinates do, inside the rollout, in
# five to nine of the twenty-five steps. `||x_i - x_j||^2` enters `phi_m`
# unnormalised, so `phi_x`'s scalar is close to linear in the squared distance
# (measured at update 1,000: -0.27 at 10 A, -1.42 at 20 A, -4.07 at 33 A), and
# one step maps an edge of length d to |1 + phi_x| * d. That is a contraction
# until `phi_x` passes -2, around d ~ 23 A, and an expansion above it -- which
# then raises d^2, which raises `phi_x`, which raises d again. The helix
# baseline starts a 12-residue window with its longest contact edge between
# 17 and 34 A depending on the crop, so some crops begin inside the expanding
# regime and reach 1e30 A in four steps. The crops that do are the ones with the
# longest starting edge, and they are the same ones each time.

[base.inputs]
# THE FIVE SETTINGS THE PAPER OMITS, at the authors' OWN defaults for this task
# (`trainers/geometric_graph.py` / `FixedTargetGAE` / `EncoderEGNCA` / `EGC` in
# `gengala/egnca`). None of these is this project's idea; each turns OFF a
# departure the port made by transcribing the four printed equations. The fifth
# -- `phi_x`'s output layer zero-initialised and unbiased -- is not a key,
# because the authors do not make it one.
#
# `has_coord_act`: a tanh on `phi_x`'s output. Their
# `parser.set_defaults(has_coord_act=True)`, `-nca` to disable. It bounds the
# scalar COEFFICIENT, not the displacement -- the vector it scales is
# (x_i - x_j), so the step is still unbounded in the neighbourhood's own scale
# and this is NOT the 0.3 A actuator cap returning.
has_coord_act = true
# `is_residual`: h' = h + phi_h(h, m). Defaults true in that trainer, which
# settles a question the port had recorded as unanswerable from the paper.
is_residual = true
# `-act`, which sets the hidden activation in all three MLPs. Ours was silu.
activation = "tanh"
# `-nt`: PairNorm(scale=1.0) on the NODE FEATURES only, after each step, never
# on the coordinates. Implemented in `aanca.egnca.pair_norm` rather than taken
# from torch-geometric, which is not a dependency of this package.
norm_type = "pn"

# the authors name gradient clipping as what stabilised their training
clip = 1.0
crop_size = 128
cutoff = 10.0
# the task: destroy this many consecutive residues, keep the rest at crystal pose
damage = 12
# a clock setting, not a scientific one: the two selections agree bit-for-bit
# on this rule's output
device_neighbours = false
eval_every = 250
eval_structures = 16
# Gala's widths. The published ~5K count is quoted against this pair; ours is
# 5,328 (tests/test_egnca.py)
hidden_dim = 16
initial = "helix"
k = 24
lr = 0.001
message_dim = 32
# the task statement: realise coordinates for THIS contact graph
native_edges = true
# window-to-context, unclamped, A^2
pairwise_weight = 1.0
# window-to-window. Both live => the FULL pair set, which is the published loss
pairwise_window_weight = 1.0
pool_probability = 0.5          # the replay pool, as published
seed = 0
split = "train"
steps = 25                      # "15 to 25 steps, sampled uniformly"
steps_min = 15
structures = 400
updates = 20000
weight_decay = 0.00001          # the authors' other named stabiliser

# The port itself. Stated as nothing, because the base IS the port: there is no
# earlier arm of this trainer for it to differ from, and every optimiser value
# in `[base.inputs]` is the authors' own for this task. **It is empty on
# purpose, and an `lr` was deliberately removed from it.**
#
# What the sweep that produced that `lr` is worth keeping for, since it will
# not be run again: `clip` is close to inert here and can be harmful, because
# the median pre-clip gradient norm is ~90-175 against `clip = 1`, so the clip
# always binds, Adam receives a direction of fixed norm and the step size is
# set by `lr` alone -- `clip 0.01` was the second-worst arm tried.
# `weight_decay` is largely cancelled by the same mechanism: Adam adds `wd * p`
# into the gradient BEFORE clipping, and the clip then rescales everything by
# about 1/100, so the published 1e-5 acts like ~1e-7. The authors' two named
# stabilisers are therefore both weaker here than their values suggest, which
# is worth knowing when reading their recipe.
[port]
[port.inputs]
