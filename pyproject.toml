[project]
name = "aanca"
version = "0.0.1"
description = "Amino-acid neural cellular automaton for protein side-chain repacking"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "biotite>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aanca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "needs_data: requires a downloaded PDB entry in data/raw/",
    "slow: runs the training script in a subprocess; tens of seconds",
]
