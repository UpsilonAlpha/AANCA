# Regeneration: a window of residues destroyed, every other residue at its
# crystal pose, the rule asked to put the window back. The metric is `rmsd_dmg`
# -- the damaged window superposed on the intact context, read on the window --
# and the number to beat is the 12.23 A an ideal helix parked in the window's
# place already scores. Nine arms before g13 sat at 12.18-12.85, i.e. did
# nothing.
#
#   python scripts/train_growth.py configs/regeneration.toml --section g15_both
#   python scripts/train_growth.py configs/regeneration.toml --list-sections
#   bash scripts/bunya_submit.sh gpu configs/regeneration.toml --section g15_both
#
# Nothing that changes a result is a command-line option: see `aanca.config`.
# [base.inputs] states every setting explicitly so that a later change to a
# parser default cannot reinterpret a run recorded here. An arm states only its
# difference from the base, which is what makes its claim to be a
# single-variable comparison readable instead of a diff of two log headers.
#
# ONE THING THE BASE GETS WRONG, LEFT AS IT IS DELIBERATELY. `lab_rotation`
# is true, so every arm here applies the emitted *rotation* in the lab frame
# while applying the translation in the residue's own frame. By the argument in
# `growth.rigid_relax` that is exactly the half of the 7 Nov bug that has not
# been fixed: an invariant encoder cannot represent a lab-frame rotation either.
# It stays true in the base because g13, g14 and g15 ran that way and this file
# has to reproduce them. The arm that turns it off belongs in a new section, not
# in an edit to this one.

[base.inputs]
activation = "sample"
activation_init = -2.0
birth = "none"  # "none": every slot alive from step 0, so nothing is grown and the window places itself
bond_weight = 0.122
clash_tolerance = 0.5
clash_weight = 1.0
clip = 1.0
completion_weight = 5.23
coupling_radius = 5.0
crop_size = 128
cward_only = false
damage = 12  # the task: destroy this many consecutive residues, keep the rest at crystal pose
equivariant_move = true  # read the emitted move in the residue's own N-CA-C frame (7 Nov; see rigid_relax)
eval_activation = "sample"
eval_every = 250
eval_structures = 12  # the 12 held-out crops every regeneration number in the record is measured on
fape_clamp = 10.0
fape_clamp_prob = 1.0
fape_weight = 0.1  # low because FAPE is clamped and so flat over the window's journey (clamped-fape node)
identity_keep = 2.0
identity_sampling = "sample"
identity_start = "masked"
identity_track = "auto"
identity_weight = 0.0
init_from = ""
initial = "helix"  # where the damaged window starts; its rmsd_dmg against native is the 12.23 A baseline
k = 32
lab_rotation = true  # ...TRANSLATION ONLY: the rotation is still applied in the lab frame. See the note below.
lr = 0.0003
max_births = 8
max_rotation = 0.1
max_translation = 0.3
morphogen = false
move_weight = 1.0  # teacher forcing: supervises every emitted move against the ideal one. CEILING, not a result.
orientation_weight = 0.0
pairwise_weight = 0.0  # off in base; the g14/g15 arms turn it on. Ordinary supervision, available to a real run.
placement_rotation = 3.14159265
placement_steps = 0
placement_translation = 4.0
reach_weight = 0.086
seed = 0
seeds = 16  # ignored under birth = none; kept at the recorded value so the arms stay byte-comparable
split = "train"
steps = 120
structures = 400
truncate = 12
update_schedule = "bernoulli"
updates = 2000

# ---------------------------------------------------------------------------
# The arms, newest last. Each is a diff against the base and nothing else.
# ---------------------------------------------------------------------------

# 32489940. An unclamped window-to-anchor distance restraint, in A^2. Attacks
# the other problem: clamped FAPE is flat over the first half of the window's
# ~13 A journey (7.5 % of its fall there, against 81.7 % for this term).
# Result: best 10.70 @1250, settled 10.91, holds 1.25 A.
[g14_pairwise.inputs]
pairwise_weight = 0.01

# ======================================================================
# RETIRED 9 Nov: every native-edges arm, and everything that inherited one.
#
# `native_edges` held the perception graph's neighbour SELECTION at the edge
# set of the native coordinates. It was taken from the published automaton
# (E(n)-equivariant Graph NCA, TMLR 2024), where the target graph is the
# problem's own input and reading it is the task statement. Here there is no
# target graph at inference, so the same wiring is a leak -- and the leak is of
# the one thing the project is for. Who contacts whom IS the structural
# interaction topology an ablation or an autoencoder on the rule would be
# trying to recover; hand it over and the rule never learns it, so there is
# nothing in the weights to read back. A ceiling on the claim is survivable; a
# ceiling on the payoff is not.
#
# The setting is gone from the schema, so these sections can no longer be
# expressed and are not commented out -- they are deleted. Their results stand
# as recorded, and the tree that produced them is commit bd0c7f8:
#
#   g13_natedge  32489939  native_edges                  settled 11.42
#   g15_both     32494313  native_edges + pairwise        settled 10.24
#   g16_localrot  (never run)  g15 + lab_rotation = false
#   g17_long     32505354  g15 + updates = 10000          settled  6.69
#   g18_seed1    32507434  g15 + seed = 1                 settled 10.21 (void)
#
# tests/test_config.py::test_the_retired_arms_can_no_longer_be_expressed holds
# their recorded command lines and asserts the schema now rejects them, so the
# removal is a measurement rather than an assumption.
# ======================================================================

# ======================================================================
# NOT YET RUN. The first arm since g7 with no ceiling INSIDE THE ROLLOUT, and
# the first in eleven arms that can report a capability rather than a bound.
#
# The distinction matters and "no ceiling of any kind" was wrong when first
# written here. A ceiling is information fed into the rollout that no real run
# has at inference: `move_weight` supplies the ideal move at every step, and
# `native_edges` supplied the target contact graph as perception. Both are gone
# from this arm. Native structure in the LOSS is not a ceiling -- it is ordinary
# supervised training, which ProteinMPNN, RFdiffusion and Chroma all do -- and
# this arm still has it, in clamped FAPE and in the native CA-CA target of the
# pairwise term. Rung 3 of the ladder is where the native target goes away.
#
# Two settings off g14_pairwise, which is now the only historical arm this
# config can express -- and the right parent, because it is the one lever arm
# that never read the native graph. Its perception has always come from the
# live coordinates, which is the real setting.
#
#   move_weight = 0   removes teacher forcing. g14 was told the ideal move at
#                     every step; this arm is told nothing about the move and
#                     must find the bearing from the restraints alone.
#   updates = 10000   because g17 established that 2000 reads an unconverged
#                     curve, and this arm must not fail for want of budget.
#
# What is left in the objective, and where each term's numbers come from:
#
#   fape      0.1   native N/CA/C in every residue's own frame, clamped at
#                   10 A. The only term in the objective that constrains
#                   ORIENTATION -- everything else is distances, which are
#                   blind to twist. Flat past the clamp, so it is the ARRIVAL
#                   term, not the approach one, and 0.1 reflects that.
#   pairwise  0.01  native CA-CA distances, window-to-intact pairs ONLY,
#                   squared and UNCLAMPED so the gradient grows with
#                   displacement and survives the 13.3 A. This is the approach
#                   term and the only thing that acts in the far regime.
#   clash     1.0   Angstrom of van der Waals overlap. No native.
#   bond            C-N against 1.329 A, omega against planar trans. No native.
#
# NOT loss terms, and listed wrongly as such on 9 Nov before this was checked:
#
#   reach           NOT what its docstring is about, here. `pending_closures`
#                   takes consecutive alive residues and `birth = none` means
#                   every slot is alive, so every pair is at separation 1 and
#                   there is no closure to foreclose. But it is NOT zero, which
#                   I claimed on 9 Nov before measuring: REACH[1] = 3.96
#                   against an ideal 3.80 leaves a 0.16 A dead band, and a
#                   rollout moving residues 0.3 A per step crosses it, so the
#                   term acts as a bond-stretch penalty duplicating part of
#                   `bond`. Measured frame gradient 1.42e-02 against FAPE's
#                   1.29e-01 (growth_balance_probe.py --damage 12).
#   pairwise_window REPORTED, never weighted: the weight applies to the anchor
#                   half alone. A diagnostic, kept because summing it with the
#                   anchor half cancels the placement signal.
#
# So the live objective is FOUR terms, of which two need no native structure.
# That is rung 2 of the information ladder -- loose FAPE plus physical
# restraints -- built since 7 Nov and never run.
# docs/claims/question-can-the-architecture-place-residues-under-any-supervision.md
#
# PRE-REGISTERED. `settled` is the mean of the last two evaluations, against
# the 12.23 A untrained baseline and g14's teacher-forced 10.91. Four
# exclusive buckets:
#
#   settled > 11.9        the window does nothing without the ideal move. The
#                         move head was the only thing working, and every
#                         number from g13 on is a property of teacher forcing.
#   10.9 < settled <= 11.9  it moves, less far than teacher forcing bought.
#                         Real but weak; the bearing is partly learnable.
#   9.5 < settled <= 10.9   it matches or beats the TEACHER-FORCED arm without
#                         being told the move. The first result in this project
#                         that bears on the thesis.
#   settled <= 9.5        beats g14 outright. Would make the ceiling arms
#                         retrospectively uninformative rather than merely
#                         uninteresting.
#
# VOID if the run does not complete 10000 updates, or if `twist` leaves the
# 9-12 band (that would be g17's rotation drift, not this arm's variable,
# and the two cannot be read apart on one curve).
#
# NOT a convergence claim either way. Every reading is at step 120, which is
# the only step anything is ever read at, so a settled value says the window
# arrived and says nothing about whether it stays. The dispersion measurement
# on this checkpoint is part of the arm, not a follow-up.
[g19_nomove]
inherits = "g14_pairwise"

[g19_nomove.inputs]
move_weight = 0.0
updates = 10000

# ======================================================================
# NOT YET RUN. One setting off g19_nomove, and the setting is a term that has
# been built since 5 Nov and switched off in every arm ever run.
#
# `relative_frame_restraint` charges how wrongly a peptide bond is ROTATED
# against the crystal's. Its own docstring says why it exists: "The objective
# has a term for a bond's *length* ... It has no term for the bond's
# *rotation* ... FAPE charges it only through where the child's atoms land,
# clamped at 10 A and averaged over every residue that exists, so one birth's
# share of that gradient is very small." `orientation_weight` has been 0.0
# since the term landed, and the quantity is reported either way -- which is
# why `twist` can climb through a whole run with nothing asking about it, as it
# did in g17_long (10.4 -> 14.3 AS placement improved).
#
# Two measurements made on 9 Nov say this is the live problem, both independent
# of that arm:
#
#   * The pairs that would tell a window its orientation is wrong are the
#     DEADEST class in the objective: read from the window's own frame the
#     intact context is 21.79 A out and only 31.0 % inside FAPE's clamp,
#     against 55.7 % the other way round, because a frame's rotation error
#     multiplies by the distance to the point.
#     docs/claims/fapes-ninety-percent-live-is-eighty-two-percent-pairs-with-zero-error.md
#   * FAPE is the ONLY term in the objective that constrains orientation at
#     all. pairwise_anchor is CA-CA (`frame_idx[:, 1]`), bond is a length plus
#     omega, clash is a radius: all three are invariant to rotating a residue's
#     frame.
#
# WEIGHT 2.5, MEASURED, not chosen. `growth_balance_probe.py --damage 12` was
# extended on 9 Nov to cover this term -- it had been missing since the term
# was added -- and run in the regeneration regime for the first time. 2.5 is
# what equalises its frame-head gradient against FAPE's (5.14e-02 against
# 1.29e-01 at weight 1.0). The same run put `pairwise` at 0.0199, which is
# within 2x of the 0.01 the arms have been using, so the probe agrees with a
# choice already made and is not being trusted here for the first time.
#
# PRE-REGISTERED, and the primary quantity is TWIST, not rmsd_dmg. g17 held
# 9-12 for its first 6000 updates and ended at 14.3; every identity-free arm
# before it held 9-12 throughout.
#
#   twist settled <= 9.0          the term works and overshoots into the
#                                 crystal's own range. Report rmsd_dmg second.
#   9.0 < twist settled <= 12.0   the term holds orientation in the band that
#                                 arms held before budget pushed g17 out of it
#   12.0 < twist settled <= 14.3  it helps but does not hold
#   twist settled > 14.3          at gradient parity with FAPE the term does
#                                 not control the quantity it was built for,
#                                 which would make the orientation error
#                                 something other than a per-bond rotation
#
# And a SECOND, independent bucket on placement, because a term at FAPE parity
# could buy orientation by spending placement:
#
#   rmsd_dmg within 0.5 A of g19's    orientation was free
#   rmsd_dmg worse by more than 0.5 A  it is a trade, and the weight is too high
#
# VOID if the run does not complete, or if g19_nomove has not been read first:
# this arm's buckets are all stated against g19's numbers, so it is strictly
# second in the queue.
[g20_orient]
inherits = "g19_nomove"

[g20_orient.inputs]
orientation_weight = 2.5
