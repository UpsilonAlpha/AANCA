# Regeneration: a window of residues destroyed, every other residue at its
# crystal pose, the rule asked to put the window back. The metric is `rmsd_dmg`
# -- the damaged window superposed on the intact context, read on the window --
# and the number to beat is the 12.23 A an ideal helix parked in the window's
# place already scores. Nine arms before g13 sat at 12.18-12.85, i.e. did
# nothing.
#
#   python scripts/train_growth.py configs/regeneration.toml --section g15_both
#   python scripts/train_growth.py configs/regeneration.toml --list-sections
#   bash scripts/bunya_submit.sh gpu configs/regeneration.toml --section g15_both
#
# Nothing that changes a result is a command-line option: see `aanca.config`.
# [base.inputs] states every setting explicitly so that a later change to a
# parser default cannot reinterpret a run recorded here. An arm states only its
# difference from the base, which is what makes its claim to be a
# single-variable comparison readable instead of a diff of two log headers.
#
# ONE THING THE BASE GETS WRONG, LEFT AS IT IS DELIBERATELY. `lab_rotation`
# is true, so every arm here applies the emitted *rotation* in the lab frame
# while applying the translation in the residue's own frame. By the argument in
# `growth.rigid_relax` that is exactly the half of the 7 Nov bug that has not
# been fixed: an invariant encoder cannot represent a lab-frame rotation either.
# It stays true in the base because g13, g14 and g15 ran that way and this file
# has to reproduce them. The arm that turns it off belongs in a new section, not
# in an edit to this one.

[base.inputs]
activation = "sample"
activation_init = -2.0
birth = "none"  # "none": every slot alive from step 0, so nothing is grown and the window places itself
bond_weight = 0.122
clash_bonded = false  # score the 15 i/i+1 pairs at or beyond CLASH_MIN_SEPARATION; false is the behaviour under which clash reads FLAT over the Ramachandran plane
clash_tolerance = 0.5
clash_weight = 1.0
clip = 1.0
completion_weight = 5.23
coupling_radius = 5.0
crop_size = 128
cward_only = false
damage = 12  # the task: destroy this many consecutive residues, keep the rest at crystal pose
equivariant_move = true  # read the emitted move in the residue's own N-CA-C frame (7 Nov; see rigid_relax)
eval_activation = "sample"
eval_every = 250
eval_structures = 12  # the 12 held-out crops every regeneration number in the record is measured on
fape_clamp = 10.0
fape_clamp_prob = 1.0
fape_weight = 0.1  # low because FAPE is clamped and so flat over the window's journey (clamped-fape node)
identity_keep = 2.0
identity_sampling = "sample"
identity_start = "masked"
identity_track = "auto"
identity_weight = 0.0
init_from = ""
initial = "helix"  # where the damaged window starts; its rmsd_dmg against native is the 12.23 A baseline
k = 32
lab_rotation = true  # ...TRANSLATION ONLY: the rotation is still applied in the lab frame. See the note below.
lr = 0.0003
max_births = 8
max_rotation = 0.1
max_translation = 0.3
morphogen = false
move_weight = 1.0  # teacher forcing: supervises every emitted move against the ideal one. CEILING, not a result.
orientation_weight = 0.0
pairwise_weight = 0.0  # off in base; the g14/g15 arms turn it on. Ordinary supervision, available to a real run.
placement_rotation = 3.14159265
placement_steps = 0
placement_translation = 4.0
reach_weight = 0.086
seed = 0
seeds = 16  # ignored under birth = none; kept at the recorded value so the arms stay byte-comparable
split = "train"
steps = 120
structures = 400
truncate = 12
freeze_context = false  # off in base; g1-g22 moved the context too. See [g24_frozen].
pool_probability = 0.0  # off in base; the Growing-NCA sample pool. See [g21_pool].
steps_min = 0  # off in base; 0 means every rollout is exactly `steps` long.
update_schedule = "bernoulli"
updates = 2000

# ---------------------------------------------------------------------------
# The arms, newest last. Each is a diff against the base and nothing else.
# ---------------------------------------------------------------------------

# 32489940. An unclamped window-to-anchor distance restraint, in A^2. Attacks
# the other problem: clamped FAPE is flat over the first half of the window's
# ~13 A journey (7.5 % of its fall there, against 81.7 % for this term).
# Result: best 10.70 @1250, settled 10.91, holds 1.25 A.
[g14_pairwise.inputs]
pairwise_weight = 0.01

# ======================================================================
# RETIRED 9 Nov: every native-edges arm, and everything that inherited one.
#
# `native_edges` held the perception graph's neighbour SELECTION at the edge
# set of the native coordinates. It was taken from the published automaton
# (E(n)-equivariant Graph NCA, TMLR 2024), where the target graph is the
# problem's own input and reading it is the task statement. Here there is no
# target graph at inference, so the same wiring is a leak -- and the leak is of
# the one thing the project is for. Who contacts whom IS the structural
# interaction topology an ablation or an autoencoder on the rule would be
# trying to recover; hand it over and the rule never learns it, so there is
# nothing in the weights to read back. A ceiling on the claim is survivable; a
# ceiling on the payoff is not.
#
# The setting is gone from the schema, so these sections can no longer be
# expressed and are not commented out -- they are deleted. Their results stand
# as recorded, and the tree that produced them is commit bd0c7f8:
#
#   g13_natedge  32489939  native_edges                  settled 11.42
#   g15_both     32494313  native_edges + pairwise        settled 10.24
#   g16_localrot  (never run)  g15 + lab_rotation = false
#                 -- re-registered 15 Nov as `g23_localrot` off g20_orient,
#                    because this comparator can no longer be expressed.
#   g17_long     32505354  g15 + updates = 10000          settled  6.69
#   g18_seed1    32507434  g15 + seed = 1                 settled 10.21 (void)
#
# tests/test_config.py::test_the_retired_arms_can_no_longer_be_expressed holds
# their recorded command lines and asserts the schema now rejects them, so the
# removal is a measurement rather than an assumption.
# ======================================================================

# ======================================================================
# NOT YET RUN. The first arm since g7 with no ceiling INSIDE THE ROLLOUT, and
# the first in eleven arms that can report a capability rather than a bound.
#
# The distinction matters and "no ceiling of any kind" was wrong when first
# written here. A ceiling is information fed into the rollout that no real run
# has at inference: `move_weight` supplies the ideal move at every step, and
# `native_edges` supplied the target contact graph as perception. Both are gone
# from this arm. Native structure in the LOSS is not a ceiling -- it is ordinary
# supervised training, which ProteinMPNN, RFdiffusion and Chroma all do -- and
# this arm still has it, in clamped FAPE and in the native CA-CA target of the
# pairwise term. Rung 3 of the ladder is where the native target goes away.
#
# Two settings off g14_pairwise, which is now the only historical arm this
# config can express -- and the right parent, because it is the one lever arm
# that never read the native graph. Its perception has always come from the
# live coordinates, which is the real setting.
#
#   move_weight = 0   removes teacher forcing. g14 was told the ideal move at
#                     every step; this arm is told nothing about the move and
#                     must find the bearing from the restraints alone.
#   updates = 10000   because g17 established that 2000 reads an unconverged
#                     curve, and this arm must not fail for want of budget.
#
# What is left in the objective, and where each term's numbers come from:
#
#   fape      0.1   native N/CA/C in every residue's own frame, clamped at
#                   10 A. The only term in the objective that constrains
#                   ORIENTATION -- everything else is distances, which are
#                   blind to twist. Flat past the clamp, so it is the ARRIVAL
#                   term, not the approach one, and 0.1 reflects that.
#   pairwise  0.01  native CA-CA distances, window-to-intact pairs ONLY,
#                   squared and UNCLAMPED so the gradient grows with
#                   displacement and survives the 13.3 A. This is the approach
#                   term and the only thing that acts in the far regime.
#   clash     1.0   Angstrom of van der Waals overlap. No native.
#   bond            C-N against 1.329 A, omega against planar trans. No native.
#
# NOT loss terms, and listed wrongly as such on 9 Nov before this was checked:
#
#   reach           NOT what its docstring is about, here. `pending_closures`
#                   takes consecutive alive residues and `birth = none` means
#                   every slot is alive, so every pair is at separation 1 and
#                   there is no closure to foreclose. But it is NOT zero, which
#                   I claimed on 9 Nov before measuring: REACH[1] = 3.96
#                   against an ideal 3.80 leaves a 0.16 A dead band, and a
#                   rollout moving residues 0.3 A per step crosses it, so the
#                   term acts as a bond-stretch penalty duplicating part of
#                   `bond`. Measured frame gradient 1.42e-02 against FAPE's
#                   1.29e-01 (growth_balance_probe.py --damage 12).
#   pairwise_window REPORTED, never weighted: the weight applies to the anchor
#                   half alone. A diagnostic, kept because summing it with the
#                   anchor half cancels the placement signal.
#
# So the live objective is FOUR terms, of which two need no native structure.
# That is rung 2 of the information ladder -- loose FAPE plus physical
# restraints -- built since 7 Nov and never run.
# docs/claims/the-architecture-can-place-residues-under-some-supervision.md
#
# PRE-REGISTERED. `settled` is the mean of the last two evaluations, against
# the 12.23 A untrained baseline and g14's teacher-forced 10.91. Four
# exclusive buckets:
#
#   settled > 11.9        the window does not move under a restraint-only
#                         objective IN 10,000 UPDATES. Read as that and not as
#                         "cannot": g17 needed five times the budget to show
#                         its gain at all, and this arm has strictly less
#                         signal than g17 had, so budget is confounded with
#                         capability in this bucket and only in this one. What
#                         it would license is "every number from g13 on is a
#                         property of teacher forcing", which is still the most
#                         consequential thing the project could learn.
#                         Amended 11 Nov before any evaluation existed.
#   10.9 < settled <= 11.9  it moves, less far than teacher forcing bought.
#                         Real but weak; the bearing is partly learnable.
#   9.5 < settled <= 10.9   it matches or beats the TEACHER-FORCED arm without
#                         being told the move. The first result in this project
#                         that bears on the thesis.
#   settled <= 9.5        beats g14 outright. Would make the ceiling arms
#                         retrospectively uninformative rather than merely
#                         uninteresting.
#
# VOID if the run does not complete 10000 updates, or if `twist` leaves the
# 9-12 band (that would be g17's rotation drift, not this arm's variable,
# and the two cannot be read apart on one curve).
#
# NOT a convergence claim either way. Every reading is at step 120, which is
# the only step anything is ever read at, so a settled value says the window
# arrived and says nothing about whether it stays. The dispersion measurement
# on this checkpoint is part of the arm, not a follow-up.
[g19_nomove]
inherits = "g14_pairwise"

[g19_nomove.inputs]
move_weight = 0.0
updates = 10000

# ======================================================================
# NOT YET RUN. One setting off g19_nomove, and the setting is a term that has
# been built since 5 Nov and switched off in every arm ever run.
#
# `relative_frame_restraint` charges how wrongly a peptide bond is ROTATED
# against the crystal's. Its own docstring says why it exists: "The objective
# has a term for a bond's *length* ... It has no term for the bond's
# *rotation* ... FAPE charges it only through where the child's atoms land,
# clamped at 10 A and averaged over every residue that exists, so one birth's
# share of that gradient is very small." `orientation_weight` has been 0.0
# since the term landed, and the quantity is reported either way -- which is
# why `twist` can climb through a whole run with nothing asking about it, as it
# did in g17_long (10.4 -> 14.3 AS placement improved).
#
# Two measurements made on 9 Nov say this is the live problem, both independent
# of that arm:
#
#   * The pairs that would tell a window its orientation is wrong are the
#     DEADEST class in the objective: read from the window's own frame the
#     intact context is 21.79 A out and only 31.0 % inside FAPE's clamp,
#     against 55.7 % the other way round, because a frame's rotation error
#     multiplies by the distance to the point.
#     docs/claims/fapes-ninety-percent-live-is-eighty-two-percent-pairs-with-zero-error.md
#   * FAPE is the ONLY term in the objective that constrains orientation at
#     all. pairwise_anchor is CA-CA (`frame_idx[:, 1]`), bond is a length plus
#     omega, clash is a radius: all three are invariant to rotating a residue's
#     frame.
#
# WEIGHT 2.5, MEASURED, not chosen. `growth_balance_probe.py --damage 12` was
# extended on 9 Nov to cover this term -- it had been missing since the term
# was added -- and run in the regeneration regime for the first time. 2.5 is
# what equalises its frame-head gradient against FAPE's (5.14e-02 against
# 1.29e-01 at weight 1.0). The same run put `pairwise` at 0.0199, which is
# within 2x of the 0.01 the arms have been using, so the probe agrees with a
# choice already made and is not being trusted here for the first time.
#
# PRE-REGISTERED, and the primary quantity is TWIST, not rmsd_dmg. g17 held
# 9-12 for its first 6000 updates and ended at 14.3; every identity-free arm
# before it held 9-12 throughout.
#
#   twist settled <= 9.0          the term works and overshoots into the
#                                 crystal's own range. Report rmsd_dmg second.
#   9.0 < twist settled <= 12.0   the term holds orientation in the band that
#                                 arms held before budget pushed g17 out of it
#   12.0 < twist settled <= 14.3  it helps but does not hold
#   twist settled > 14.3          at gradient parity with FAPE the term does
#                                 not control the quantity it was built for,
#                                 which would make the orientation error
#                                 something other than a per-bond rotation
#
# And a SECOND, independent bucket on placement, because a term at FAPE parity
# could buy orientation by spending placement:
#
#   rmsd_dmg within 0.5 A of g19's    orientation was free
#   rmsd_dmg worse by more than 0.5 A  it is a trade, and the weight is too high
#
# VOID if the run does not complete, or if g19_nomove has not been read first:
# this arm's buckets are all stated against g19's numbers, so it is strictly
# second in the queue.
#
# AND VOID IF g19 LANDS IN ITS DEAD BUCKET (settled > 11.9). Amended 11 Nov,
# before either run had written an evaluation, because stating the question
# exposed the hole: `twist` on a window that never moved is not the quantity
# this arm is about. g17's drift was twist rising AS PLACEMENT IMPROVED, so the
# term is being asked whether it controls orientation DURING placement. With no
# placement there is nothing for it to control, a low twist would mean only
# that an unmoved window kept the baseline helix's relative rotations, and the
# 9-12 band it would sit in is the band those arms sat in for exactly that
# reason. In that case this arm is uninformative rather than negative, and the
# orientation question reopens behind whatever g19's failure turns out to be.
[g20_orient]
inherits = "g19_nomove"

[g20_orient.inputs]
orientation_weight = 2.5

# ======================================================================
# NOT YET RUN. Persistence, which the 13 Nov dispersion measurement turned from
# the cheapest available improvement into a precondition.
#
# g20_orient's own checkpoint takes a window from 7.78 A at its 120-step
# training horizon to 16.4-16.9 A at 600 steps, against a 12.23 A UNTRAINED
# baseline, with 0 of 48 rollouts converging. So the rule does not hold what it
# builds; past the horizon it drives the window further from native than leaving
# it alone would.
# docs/claims/the-rule-has-no-attractor-past-its-training-horizon.md
#
# That blocks the statistical-potential programme rather than delaying it: -log
# of a distribution needs a distribution, and a diverging trajectory is not one.
# A Potts model fitted to the current spread would be a confident model of
# drift.
#
# Two settings, both Growing-NCA mechanisms this trainer has never had, and both
# aimed at the same thing:
#
#   pool_probability 0.5   half of all updates RESUME a remembered end-state
#                          instead of starting from a fresh baseline, so the
#                          rule meets states it has already wandered into as
#                          INPUTS. Keyed by (structure, crop seed) -- a state
#                          grown on one crop is meaningless on another. An
#                          end-state is kept only if it is no worse than that
#                          crop's own fresh baseline, because an unguarded pool
#                          would fill with the 16 A states above and train on
#                          them.
#   steps_min 40           each rollout's length is drawn from [40, 120]
#                          instead of being exactly 120. A fixed length teaches
#                          one trajectory of that length; a length the rule
#                          cannot anticipate asks for a state that persists.
#                          Growing NCA draws its step count per sample;
#                          E(n)-GNCA trains over 15-25 steps and reports its
#                          attractor held 1,000 steps past training.
#
# TWO settings at once, deliberately, against this file's usual one-variable
# rule. They are not independent: a pool without length jitter still only ever
# supervises step 120, and jitter without a pool still only ever starts from the
# baseline. Separating them would cost two slots to test half a mechanism each.
# Recorded as a departure rather than smuggled.
#
# PRE-REGISTERED, and the primary quantity is NOT rmsd_dmg. It is the 600-step
# reading from scripts/regrowth_dispersion.py on this arm's checkpoint, against
# g20's 16.4-16.9 A and the 12.23 A untrained baseline:
#
#   600-step rmsd_dmg <= 9.0        the rule holds its structure. The
#                                   statistical-potential programme is
#                                   unblocked and the ensemble is a distribution
#                                   over poses rather than over drift.
#   9.0 < 600-step <= 12.23         it holds better than doing nothing, which is
#                                   more than g20 manages, but the basin is wide
#   12.23 < 600-step <= 16.4        persistence improved and the rule still ends
#                                   up worse than untouched: the mechanism helps
#                                   and is not sufficient
#   600-step > 16.4                 no better than g20. Persistence is not a
#                                   training-protocol problem and the next move
#                                   is architectural.
#
# SECOND, independent: `settled` at step 120 within 1.0 A of g20's 7.78. The
# pool trades some horizon accuracy for persistence by construction, and more
# than an Angstrom of it means the price is too high to read the first bucket
# against g20 at all.
#
# THIRD, and added 13 Nov on noticing a flaw in this arm's own design: the
# ENSEMBLE SPREAD at step 120, from the same script, against g20's figures.
#
# The guard above keeps an end-state only if it is no worse than the crop's
# fresh baseline. That guard is right -- without it the pool trains on the
# rule's own divergence -- but it is also SELECTIVE PRESSURE TOWARD ONE GOOD
# ANSWER, and a narrow distribution is exactly what the statistical-potential
# programme cannot use. So this arm could succeed at persistence by collapsing
# the very multiplicity the persistence was wanted for, and the first two
# buckets would both read as wins while the programme stayed blocked.
#
#   spread at 120 falls by more than half against g20   the pool bought
#       persistence by narrowing the distribution. Persistence is real and the
#       potential programme is no better off; the guard needs replacing with
#       something that does not rank states by accuracy alone.
#   spread holds or rises                               persistence and
#       multiplicity are compatible under this protocol, which is the result
#       the whole chain needs and nothing has yet shown.
#
# Costs nothing: same script, same checkpoint, one extra column.
#
# VOID if the run does not complete, or if `twist` leaves the 9-12 band --
# g20's orientation term is inherited and this arm is not the place to retest
# it.
[g21_pool]
inherits = "g20_orient"

[g21_pool.inputs]
pool_probability = 0.5
steps_min = 40

# ---------------------------------------------------------------------------
# g22_random -- take the helix away and ask the rule to produce one.
#
# Ulban, 14 Nov: the model should learn to form helices and sheets, so it
# should not be handed one. Every arm from g1 to g21 ran `initial = "helix"`,
# which is the default, so the damaged window has always STARTED as an ideal
# helix and the rule has only ever been asked to MOVE one. About a third of PDB
# residues are helical, so that is a third of the answer handed over for free,
# and it makes the claim this project now wants to make -- that a local rule
# learns secondary structure -- untestable, because a learned helix and the one
# in the start state are indistinguishable.
#
# `initial = "random"` draws phi/psi uniformly, so there is no secondary
# structure in the start state at all. Measured cost on the laptop pool, 12
# crops, 12-residue window (scripts/baseline_probe.py --damage 12):
#
#   start state   rmsd_dmg   bond     live
#   helix           10.77   4.5043   90.1%
#   random          14.12   5.4872   87.1%
#   extended        21.30  17.9454   86.6%
#
# So 3.35 A further out and nothing else: inside the 36 A reach ceiling, FAPE
# still 87% live, bond barely moved because the walk's covalent geometry is
# ideal whatever the torsions are. `extended` is the mode that would have been
# a problem and is probably why helix stuck.
#
# RE-MEASURE THE BASELINE ON BUNYA BEFORE READING THIS ARM. Those are laptop
# numbers on a 954-structure pool; the same code reads 12.23 for helix on
# Bunya's 24k. The comparison is against Bunya's own random baseline, not
# against 14.12.
#
# PRE-REGISTERED. Bucket 0 was added 20 Nov and is the PRIMARY condition; the
# two below it are diagnostics that say WHY it passed or failed.
#
#   0. DOES IT PUT THE ATOMS BACK WHERE THEY BELONG? An ABSOLUTE threshold, in
#      Angstroms, fixed before the run, and NOT a margin over our own baseline.
#      Ulban, 20 Nov: either the AANCAs can regrow a backbone or they cannot,
#      and that needs a directly achievable success/failure condition. Every
#      number in this project so far has been quoted as progress-over-baseline,
#      which flatters a rule that ends up in the wrong place from a start that
#      was further wrong.
#
#        rmsd_damaged <= 2.0 A    SOLVED. Comparable to dedicated loop
#            modelling on a window this long.
#        rmsd_damaged <= 4.0 A    PASS. The window is where it belongs.
#        rmsd_damaged  > 4.0 A    FAIL.
#        >= the geometric floor   NO SIGNAL AT ALL, whatever the absolute
#            value. See FLOOR below.
#
#      4.0 A because the CA-CA spacing is 3.8 A, so that is the scale at which
#      every residue is within ONE POSITION of where it belongs. Above it the
#      residues are displaced by more than a residue's width, which is a
#      different conformation and not a noisy version of the right one. The
#      line is physical rather than borrowed from a convention.
#
#      WHICH NUMBER THE BAR IS ON, and this was got WRONG when bucket 0 was
#      first written, so it is spelled out. There are two superposition
#      conventions and they are not the same measurement:
#
#        fit_all     `backbone_rmsd_on(.., geometric, damaged)` with
#                    `geometric = final.alive` (growth.py:1912), and these runs
#                    are 100% alive -- so the fit includes THE DISPLACED WINDOW
#                    ITSELF. This is `rmsd_damaged`, the column every arm in
#                    this project has ever been scored by.
#        fit_intact  the same call with `anchors` -- the surviving context
#                    alone. This is what `backbone_rmsd_on`'s own docstring
#                    says the fit should be, because a residue whose placement
#                    is the question cannot also be part of what the frame is
#                    fitted to.
#
#      Measured on the laptop pool, 12 crops, 12-residue window
#      (`scripts/baseline_probe.py --damage 12`), on START STATES:
#
#        baseline     fit_all  fit_intact   diff
#        helix          10.77       11.83   1.06
#        random         14.12       15.84   1.73
#        extended       21.30       23.74   2.44
#
#      So fit_all UNDER-REPORTS the placement error, and the gap grows with
#      displacement because the fit absorbs more of the thing being asked
#      about. **BUCKET 0 IS ON fit_intact.** The 4.0 A line does not move --
#      it is a physical argument about CA-CA spacing and is convention
#      independent -- but it has to be unambiguous which number it is a line
#      on, and the one every arm was scored by is the wrong one.
#
#      Consequence worth stating plainly: the gap on a TRAINED rollout has
#      never been measured, only on start states, so g20's 7.78 and g21's 8.41
#      are both fit_all and both flatter the rule by an unknown amount of order
#      1-2 A. The trainer now logs both columns so this stops being unknown.
#        * Reach is not the limit: 0.3 A/step x 120 steps = 36 A of budget
#          against a ~14 A journey from the random start.
#        * Resolution is not capped -- nothing forces the per-step move to stay
#          large, so 4 A is a convergence question and not a budget one.
#        * The task is well posed: the residue one-hot is 20 of the 32 node
#          dims (`torch_graph.py:630`), so the rule sees the sequence of the
#          window it is replacing. Sequence plus fixed flanks -> conformation
#          has a right answer.
#
#      FLOOR, and it must be measured before this arm is read either way. A
#      12-residue window pinned at both ends cannot go anywhere: the closure
#      constraint alone forces some RMSD range, with no knowledge of the native
#      pose. If that range is ~9 A then 8.5 A was never a signal and neither
#      would 5 A be; if it is ~14 A then a 4 A result is real. One CPU job, no
#      training, no network. WITHOUT IT A PASS IS AS UNINTERPRETABLE AS A FAIL,
#      which is why it is part of this registration and not a follow-up.
#
#      CONVERGENCE, the one escape clause and it is narrow: if the held-out
#      curve is still falling at the budget, the result is NOT CONVERGED and
#      not FAIL. Flat curve or no verdict.
#
#      AND THE DISCIPLINE THIS BUCKET EXISTS FOR: if it fails, we do NOT add
#      terms and re-run. A fail at 8-ish A against a measured floor means a
#      local rule with this information cannot place a backbone, and that is
#      the finding. 23 arms have been read as improvements over each other
#      while none of them was ever read against a number that meant anything.
#      This is the clause that makes this a test rather than arm 24.
#
#   1. PLACEMENT, against its own baseline. g20 beat the helix baseline by
#      4.45 A. Does this arm beat the RANDOM baseline by a comparable margin?
#        > 3.5 A of progress   the rule places a window without being handed
#            its secondary structure, and g20's result was not the prior.
#        1.5 - 3.5 A           partial; report as a weaker capability from a
#            harder start, and do not quote g20's 7.78 as comparable.
#        < 1.5 A               most of g20's 4.45 A was the helix. That is a
#            finding and it retires the headline number.
#
#   2. LEARNED SECONDARY STRUCTURE, which is the actual question. On window
#      residues whose NATIVE torsions are helical, what fraction does the rule
#      place in the helical Ramachandran basin at step 120? Against two
#      references: the random start state's own rate (chance, ~5-10% for a
#      uniform draw into one basin) and g20's rate (uninformative by
#      construction, since it starts at 100%).
#        well above chance   DIRECT evidence of learned secondary structure,
#            which is a stronger and more legible result than any rmsd_dmg and
#            is the thing to lead with.
#        at chance           the rule moves windows without learning local
#            conformational preference, so "learns physics" is not supported
#            however good the RMSD is.
#      Needs measure_backbone_torsions on the rollout output; backbone.py
#      already returns (phi, psi, omega) per residue, so this is a readout and
#      not a code change to the trainer.
#
# VOID if the run does not complete. The `twist` clause is NARROWED as of
# 20 Nov: twist leaving the 9-12 band voids buckets 1 and 2, which are
# comparisons against g20, and does NOT void bucket 0, which is an absolute
# threshold that no other arm enters. A regime marker cannot invalidate a
# measurement that is not a comparison. This matters because the twist guard
# has now voided the placement number of two consecutive arms -- g19_nomove
# and g21_pool -- and in g21's case it also took down the gate that was
# supposed to license reading its primary bucket
# (`docs/claims/the-pool-and-length-jitter-stop-the-divergence-past-the-training-horizon.md`).
# An absolute bar is immune to that failure mode, which is most of the argument
# for having one.
#
# ONE VARIABLE against g20_orient. Deliberately NOT inheriting g21_pool: the
# pool is a separate open question and stacking them would confound the start
# state with persistence. Bucket 0 is read at step 120, the trained horizon, so
# it does not need the persistence the pool buys.
#
# ---------------------------------------------------------------------------
# A NOTE ON SCATTERED STARTS, recorded 20 Nov and deliberately NOT built.
#
# Ulban: residues could be scattered randomly in space like diffusion does, and
# the rule should solve it -- offered as a viable starting point rather than as
# the one to use. `initial = "random"` above is the cheap version of the same
# argument (no secondary structure handed over) and costs one config key, so it
# is what this arm runs. The scattered version would be a fourth BASELINE_MODE
# and is kept here because two of its constraints are architectural facts worth
# not rediscovering:
#
#   * PER-RESIDUE RIGID, never per-atom. `rigid_relax` rotates and translates
#     each residue's atoms about its own CA, so the rule's only output is a
#     frame update and it has NO MECHANISM to change internal geometry.
#     Scattering atoms within a residue would create damage it cannot repair by
#     construction, and the run would fail for a reason that says nothing about
#     the thesis.
#   * SCATTER THE WINDOW, NOT THE WHOLE STRUCTURE. `rmsd_damaged` is a
#     placement number only because the intact context is pinned and defines
#     the frame the superposition is fitted on. Scatter everything and there is
#     no frame left to measure placement in, and the shape/placement
#     distinction collapses -- the exact failure seven arms could not see.
#   * And the reach arithmetic sets the radius: 0.3 A/step x 120 = 36 A of
#     straight-line budget, and real trajectories are not straight. A 15 A
#     sphere about the window centroid needs ~50-70 steps of directed motion
#     and is a real test; the full crop bounding box exceeds the budget, so a
#     failure there would measure `steps` rather than capability.
#
# What CANNOT be done to help it: freezing the selection to the native edge
# set. That was `native_edges`, removed 9 Nov as a leak of the one thing the
# project exists to recover (`torch_graph.py:330`). It has to work on live
# graphs, which the forced sequence neighbours make possible -- residue i
# always perceives i+-1 at any distance, so the chain can zip up from
# connectivity before any contact comes inside the 10 A cutoff.
[g22_random]
inherits = "g20_orient"

[g22_random.inputs]
initial = "random"

# ======================================================================
# NOT YET RUN. The rotation half of the 7 Nov equivariance fix, which has been
# switched off in every arm ever run and is now measured rather than argued.
#
# `tests/test_move_equivariance.py::test_a_lab_frame_rotation_is_not_equivariant_either`
# puts it at **0.68 A of equivariance error on a 1.50 A move, 45 % of the
# move** -- larger in proportion than the translation half's 27 %, and
# unchanged by `equivariant_move` because the two halves are independent. With
# `lab_rotation = true` the emitted axis is an axis in LAB coordinates while
# perception is invariant, so the same neighbourhood turns a residue about the
# same lab direction whichever way the protein faces. "Turn towards the
# gradient" is not expressible, however it is trained.
#
# WHY IT IS SAFE TO DROP NOW, which was not true in g10-g12. The reason
# `lab_rotation = true` was kept is a four-arm table where the local
# conjugation trebled the amplitude of the twist break -- 16.6 (g8) and 17.6
# (g11) against 50.2 (g10) and 53.9 (g12). But that break belongs to the
# IDENTITY term, not to the conjugation
# (`docs/claims/the-twist-jump-at-update-1000-is-the-identity-head-leaving-its-floor.md`),
# and `identity_weight = 0.0` in this base. There is nothing left for the
# conjugation to amplify.
#
# PRE-REGISTERED, against `g20_orient`'s 7.78 A at its 120-step horizon, which
# is this chain's head rather than the retired g15 the first draft of this
# registration used. One setting differs.
#
#   * BETTER than 7.78  -- the lab-frame axis was costing the frame head real
#     distance, the rotation half becomes the live direction, and
#     `lab_rotation = false` should become the base.
#   * NO RESOLVABLE DIFFERENCE -- a null, not a confirmation. The flag flips to
#     false on the representation argument alone, because it then costs
#     nothing and removes an inexpressibility, and the next arm is elsewhere.
#   * WORSE -- the representation argument says this should be impossible, so
#     either invariance is not the binding constraint or the conjugation has a
#     cost of its own, and the rotation-half claim is refuted rather than
#     merely unsupported.
#   * TWIST TREBLES out of its band at any evaluation -- the amplitude effect
#     did not need the identity break after all, the four-arm table attributed
#     it to the wrong cause, and this is wrong whatever rmsd_dmg does. OVERRIDES
#     the other three.
#
# NO +- WINDOW IS STATED, deliberately. The first draft of this registration
# used +-0.34 A derived from the g14-to-g15 gap, and both of those arms are
# retired. No arm has ever been replicated
# (`docs/claims/no-growth-arm-has-been-run-twice-so-no-difference-has-an-error-bar.md`),
# so there is no figure to justify a window with, and inventing one here would
# be choosing the metric after the fact. A reading close to 7.78 must be
# reported as "no difference resolvable" until a replicate exists.
#
# VOID if the run does not reach its update budget, or `bond` climbs above 4.5,
# which is geometry breaking rather than rotating.
# ======================================================================

[g23_localrot]
inherits = "g20_orient"

[g23_localrot.inputs]
lab_rotation = false

# ---------------------------------------------------------------------------
# g24_frozen -- let only the placed residues move.
#
# *** GATE OPEN (21 Nov evening). This arm was gated for half a day on a
# *** retraction that was itself wrong, and the gate is now cleared by direct
# *** measurement: scripts/context_drift.py on runs/g22_random/best.pt reads
# *** 2.3402 A of context N/CA/C drift with the context free (job 33277250) and
# *** exactly 0.0000 A with it frozen (33277251), over the 12 crops the arm was
# *** judged on. So the context really is being displaced, freezing really does
# *** stop it, and the second pre-registered bucket below -- that drift must
# *** read ~0 under freezing or the flag was dropped -- is already SATISFIED.
# ***
# *** The retraction's error, recorded so it is not repeated: the null used to
# *** kill the claim was an UNTRAINED rule, whose move heads emit ~0 and which
# *** therefore cannot drift at all. A null that cannot exhibit the effect is
# *** not a null. (docs/claims/the-rule-displaces-the-surviving-context-it-is-
# *** supposed-to-read.md, now status supported.)
#
# Ulban, 21 Nov, after g22_random failed its absolute bar: "let's try one where
# only the placed residues can move."
#
# WHAT CHANGES. One key, `freeze_context = true`, which passes
# `frozen = ~damaged` to a rollout parameter that has existed all along and was
# never wired to the growth path. The surviving residues still TICK -- they
# perceive, update hidden state and send messages -- and only their geometry is
# pinned. `alive` gates the cell, `frozen` gates its atoms. If the context
# stopped talking there would be no surviving context to regenerate from, which
# is the whole task.
#
# WHY. g1-g22 ran the context free, which was a deliberate design choice with a
# stated reason (growth.py, at the rollout call): whole-structure FAPE was meant
# to teach "leave the context alone" as well as "fill the window", and that
# second half is what stops "emit nothing" being a free solution. **That
# enforcement was measured on 21 Nov and it fails.** Decomposing g22_random's
# `rmsd` against its `rmsd_dmg`:
#
#   g22_random            rmsd   window-only predicts   implied context
#   update 250 (untrained) 3.96                  3.79             1.20 A
#   update 10000 (settled) 3.73                  2.58             2.83 A
#
# The drift MORE THAN DOUBLES over training. Nothing charges the rule for moving
# anchors while FAPE and the pairwise anchor term both reward relieving window
# strain by dragging the context toward the window rather than the reverse. So
# the rule spends ten thousand updates learning to corrupt the reference frame
# its placement is measured against
# (docs/claims/the-rule-displaces-the-surviving-context-it-is-supposed-to-read.md).
#
# THE OBJECTION, AND IT IS A REAL ONE. Freezing makes "emit nothing" free for
# 116 of 128 residues, removing the half of the FAPE signal that was meant to
# prevent the degenerate identity solution. It does not transfer to this
# regime: the four arms of 6 Nov that froze at their start were running
# RECONSTRUCTION, where doing nothing was both the stable answer and near the
# scored one. Under regeneration with a frozen context, doing nothing leaves the
# window 13.3 A out of place while the context is exactly right, and both FAPE
# on the window and the unclamped window-to-anchor term see that directly.
#
# PRE-REGISTERED. Bucket 0 is INHERITED UNCHANGED from g22_random and the line
# does not move: `rmsd_dmg_fit_intact <= 4.0 A` is a PASS, > 4.0 is a FAIL,
# <= 2.0 is solved, and at or above the geometric floor is no signal at all.
# The comparators are measured and already on disk:
#
#   g22_random settled, context free        9.02 A  fit_intact
#   GEOMETRIC FLOOR, random start           9.48 A  fit_intact  (33249842)
#   floor, best of 10 restarts              6.00 A  fit_intact
#   g22_random start state                 13.44 A  fit_intact
#
#   <= 4.0            PASS. The context was the problem and the architecture
#       places a backbone once it stops destroying its own reference frame.
#   4.0 - 7.0         a real effect and still a fail. Freezing recovers part of
#       the gap, the mechanism is confirmed as A cause, and the next variable
#       is `truncate` -- the gradient reaching 27 % of the journey.
#   7.0 - 9.02        marginal. Report as "the direction is right and the
#       magnitude is inside the noise of an unreplicated arm", and do NOT
#       quote it as a win: nothing here has an error bar
#       (docs/claims/no-growth-arm-has-been-run-twice-so-no-difference-has-an-error-bar.md).
#   >= 9.02           freezing does not help, so context corruption was a
#       symptom and not a cause. That is the most informative outcome for the
#       architecture question and the one that would retire the mechanism.
#   worse than 13.44  the rule was RELYING on context motion to relieve strain,
#       and g22's 9.02 depended on being allowed to corrupt its frame. Also a
#       finding, and it would mean every arm in the record is measured against
#       a frame it moved.
#
# SECOND, and it is free: the implied context displacement must read ~0 by
# construction. If it does not, `frozen` was not applied and the run is void --
# the exact failure mode this project has hit twice, where a flag was dropped
# and the run reported as though it had been honoured. The banner now prints
# FROZEN CONTEXT or CONTEXT IS FREE so the log says which.
#
# NOT COMPARABLE column-for-column with g1-g22 on `fape`, `rmsd` or `twist`:
# those are means over residues or bonded pairs and 116 of 128 residues now
# cannot move, so they are different quantities. `rmsd_dmg` and its fit_intact
# twin are the comparable columns, which is why the bar is on one of them.
#
# ONE VARIABLE against g22_random, so the neutral random start and the absolute
# bar both carry over unchanged.
[g24_frozen]
inherits = "g22_random"

[g24_frozen.inputs]
freeze_context = true

# ---------------------------------------------------------------------------
# g25-g27 -- fix the two known defects. Ulban, 21 Nov: "fix the known defects".
#
# Both are faults rather than tuning knobs, both were measured before these arms
# existed, and both sit on top of [g24_frozen], which is now the best
# configuration (8.49 A fit_intact) and the only recent arm whose `twist` is
# inside the 9-12 band and whose buckets are therefore readable at all.
#
# DEFECT 1 -- THE GRADIENT REACHES A QUARTER OF THE JOURNEY. `truncate = 12`
# against `steps = 120`, unoverridden by any arm from g14 to g24. BPTT carries
# gradient through the last 12 steps only: 3.6 A of visible travel at the 0.3 A
# cap, against a start state ~13.4 A out of place. 27 %. Measured model-free in
# docs/claims/the-gradient-window-is-a-third-of-the-journey-the-window-must-
# travel.md, which named it the binding constraint and the per-step cap as
# binding on nothing (3.6x headroom). That note called itself "pre-positioning
# rather than a result -- it says which rollout hyperparameter to test first",
# and g22's failure is the condition it was waiting for.
#
# DEFECT 2 -- HALF THE MOVE OPERATOR IS UNSTEERABLE. `lab_rotation = true`
# leaves the rotation half of the move in the lab frame. The perception is
# invariant by construction (1.0e-08), so a lab-frame direction is one an
# invariant encoder cannot represent and no objective can teach. Measured at
# 0.68 A of error on a 1.50 A move -- 45 %, LARGER than the 27 % translation
# half that was fixed on 7 Nov, and `equivariant_move` does not touch it.
# Pinned in tests/test_move_equivariance.py.
#
# `g23_localrot` already tried defect 2 alone and settled at twist 12.9, VOID on
# its own guard. We now know context drift inflates twist -- a bonded pair's
# relative rotation is a statement about TWO residues, so a drifted context
# residue reads as twist that the rule never caused -- and g24 pins the context
# and lands at 10.3. So the same test on a frozen base should be readable where
# g23's was not. That is why these inherit g24_frozen and not g20_orient.
#
# PRE-REGISTERED, and bucket 0 DOES NOT MOVE. `rmsd_dmg_fit_intact <= 4.0 A`
# passes, > 4.0 fails, <= 2.0 is solved, at or above the geometric floor is no
# signal. Comparators, all on the same 12 held-out crops:
#
#   untrained start                          13.44 A
#   geometric floor, random (re-measuring)   ~9.5-9.8 A   33282053
#   g22_random, context free                  9.02 A
#   g24_frozen, context pinned                8.49 A   <- the arm to beat
#   bucket 0 PASS                              4.00 A
#
#   <= 4.0          PASS. The defects were the problem. A local rule places a
#       backbone once its gradient reaches the journey and its actuator is
#       steerable, and the architecture is vindicated.
#   4.0 - 6.5       a large real effect and still a fail. The defects mattered
#       and were not the whole story; report the size and stop adding arms,
#       because at that point the remaining gap is the architecture's.
#   6.5 - 8.49      a real effect inside the noise of an unreplicated seed.
#       Report direction only, and SAY SO rather than quoting the margin.
#   >= 8.49         the defects were not what was holding it back. This is the
#       most informative outcome for the central claim and the one that should
#       end the arm chain: three measured faults fixed, no improvement, and the
#       constraint is the local rule itself.
#
# SECOND, free, and the thing to lead with if twist stays in band: bucket 2,
# the fraction of natively-helical window residues placed in the helical
# Ramachandran basin against a ~5-10 % chance rate. Direct evidence of learned
# secondary structure, worth more than any rmsd_dmg, and never computed for any
# arm. Readable on these arms precisely because g24 brought twist back in band.
#
# VOID if a run does not complete. `twist` leaving 9-12 voids the comparisons
# against g24 but NOT bucket 0, by the narrowing of 20 Nov: a regime marker
# cannot invalidate a measurement that is not a comparison.
#
# ONE VARIABLE EACH for g25 and g26, so the attribution is clean; g27 is both
# together and is the arm that answers "does it do the job once the known faults
# are fixed", which is the question actually asked. g26's `truncate` is set to
# the largest value a short feasibility run survives -- full BPTT over 120 steps
# may not fit, and an assumed value that silently OOMs is a wasted slot.
[g25_equivariant]
inherits = "g24_frozen"

[g25_equivariant.inputs]
lab_rotation = false

[g26_fullbptt]
inherits = "g24_frozen"

[g26_fullbptt.inputs]
truncate = 120

# *** DO NOT RUN g27_both (22 Nov). g26_fullbptt measured truncate = 120 as
# *** HARMFUL -- 1.68 A worse than g24_frozen and above the geometric floor,
# *** so no signal at all -- and g26's own `>= 8.49` bucket reads "the defects
# *** were not what was holding it back... should end the arm chain rather than
# *** extend it". g27 is the rotation fix plus that harmful change. Kept
# *** registered so the decision not to run it is on the record rather than a
# *** silent omission.
[g27_both]
inherits = "g24_frozen"

[g27_both.inputs]
lab_rotation = false
truncate = 120
